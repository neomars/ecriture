name: Compilation Multi-Plateformes

permissions:
  contents: write

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  # ÉTAPE 1 : Compilation sur les 3 OS
  build:
    name: Build sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Configuration pour Windows
          - os: windows-latest
            artifact_name: ecriture-windows.exe
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "static;static" --add-data "templates;templates" --add-data "locales;locales" --add-data "images;images" --add-data "projects;projects" --name ecriture main.py
            bin_path: dist/ecriture.exe

          # Configuration pour macOS (.dmg)
          - os: macos-latest
            artifact_name: ecriture-macos.dmg
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "static:static" --add-data "templates:templates" --add-data "locales:locales" --add-data "images:images" --add-data "projects:projects" --name ecriture main.py
            bin_path: dist/ecriture-macos.dmg

          # Configuration pour Linux
          - os: ubuntu-latest
            artifact_name: ecriture-linux
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --add-data "static:static" --add-data "templates:templates" --add-data "locales:locales" --add-data "images:images" --add-data "projects:projects" --name ecriture-linux main.py
            bin_path: dist/ecriture-linux

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build du Frontend JS
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build --if-present
          fi

      - name: Installation des dépendances Python & PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Compilation avec PyInstaller
        run: ${{ matrix.pyinstaller_cmd }}

      # Étape spécifique macOS : Transforme dist/ecriture.app en fichier dist/ecriture-macos.dmg
      - name: Génération du fichier .dmg pour macOS
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil create -volname "Ecriture" -srcfolder dist/ecriture.app -ov -format UDZO dist/ecriture-macos.dmg

      - name: Sauvegarder l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bin_path }}

  # ÉTAPE 2 : Attacher les 3 fichiers distincts à la Release
  release:
    name: Attacher les fichiers à la Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les binaires compilés
        uses: actions/download-artifact@v4
        with:
          path: binaires
          merge-multiple: true

      - name: Publier les exécutables sur la Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaires/*
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
