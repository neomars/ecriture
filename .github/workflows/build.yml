name: Compilation Multi-Plateformes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 1. AUTORISATION D'ÉCRITURE : Obligatoire pour créer une Release GitHub
permissions:
  contents: write

jobs:
  build:
    name: Build sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ecriture-windows.exe
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web;web" --name ecriture main.py
            bin_path: dist/ecriture.exe

          - os: macos-latest
            artifact_name: ecriture-macos
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web:web" --name ecriture main.py
            bin_path: dist/ecriture

          - os: ubuntu-latest
            artifact_name: ecriture-linux
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --add-data "web:web" --name ecriture main.py
            bin_path: dist/ecriture

    steps:
      # 2. FETCH-DEPTH: 0 pour récupérer tous les tags et éviter l'erreur 128 de Git
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build du Frontend JS
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build --if-present
          fi
        shell: bash

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Compilation avec PyInstaller
        run: ${{ matrix.pyinstaller_cmd }}

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bin_path }}

      # 3. La release ne s'exécute QUE si vous avez poussé un tag (ex: v1.0.0)
      - name: Créer la Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bin_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
