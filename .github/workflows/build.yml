name: Compilation Multi-Plateformes

on:
  push:
    tags:
      - 'v*' # Se déclenche uniquement lors du push d'un tag (ex: v1.0.0)
  workflow_dispatch: # Lancement manuel pour tester les builds

permissions:
  contents: write

jobs:
  build:
    name: Build sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ecriture-windows
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web;web" --name ecriture main.py
            bin_path: dist/ecriture.exe

          - os: macos-latest
            artifact_name: ecriture-macos
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web:web" --name ecriture main.py
            bin_path: dist/ecriture

          - os: ubuntu-latest
            artifact_name: ecriture-linux
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --add-data "web:web" --name ecriture main.py
            bin_path: dist/ecriture

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build du Frontend JS
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build --if-present
          fi
        shell: bash

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Compilation avec PyInstaller
        run: ${{ matrix.pyinstaller_cmd }}

      # Étape 1 : Les fichiers compilés sont TOUJOURS enregistrés dans les Artifacts GitHub
      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bin_path }}

      # Étape 2 : Publication officielle de la Release (Uniquement si déclenché par un tag)
      - name: Publier la Release avec GitHub CLI
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ matrix.bin_path }}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
