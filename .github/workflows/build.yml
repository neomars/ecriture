name: Compilation Multi-Plateformes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------
  # JOB 1 : Compilation des 3 binaires en parallèle
  # -------------------------------------------------------
  build:
    name: Build sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ecriture-windows
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web;web" --name ecriture-windows.exe main.py
            bin_path: dist/ecriture-windows.exe

          - os: macos-latest
            artifact_name: ecriture-macos
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web:web" --name ecriture-macos main.py
            bin_path: dist/ecriture-macos

          - os: ubuntu-latest
            artifact_name: ecriture-linux
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --add-data "web:web" --name ecriture-linux main.py
            bin_path: dist/ecriture-linux

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build du Frontend JS
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build --if-present
          fi
        shell: bash

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Compilation avec PyInstaller
        run: ${{ matrix.pyinstaller_cmd }}

      - name: Sauvegarde de l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bin_path }}

  # -------------------------------------------------------
  # JOB 2 : Attachement des 3 exécutables à la Release GitHub
  # -------------------------------------------------------
  release:
    name: Publier la Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tous les exécutables compilés
        uses: actions/download-artifact@v4
        with:
          path: binaires
          merge-multiple: true

      - name: Créer la Release GitHub avec les 3 fichiers
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" binaires/* \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
