name: Compilation Multi-Plateformes

on:
  push:
    tags:
      - 'v*' # Se déclenche lors du push d'un tag (ex: v1.0.0)
  workflow_dispatch: # Lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    name: Build sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ecriture-windows.exe
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web;web" --name ecriture main.py
            bin_path: dist/ecriture.exe

          - os: macos-latest
            artifact_name: ecriture-macos
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --windowed --add-data "web:web" --name ecriture main.py
            bin_path: dist/ecriture

          - os: ubuntu-latest
            artifact_name: ecriture-linux
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --add-data "web:web" --name ecriture main.py
            bin_path: dist/ecriture

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build du Frontend JS
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build --if-present
          fi
        shell: bash

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Compilation avec PyInstaller
        run: ${{ matrix.pyinstaller_cmd }}

      # Les exécutables seront TOUJOURS disponibles au téléchargement dans les Artifacts
      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bin_path }}

      # La Release GitHub ne s'exécutera QUE si vous avez poussé un Tag Git
      - name: Créer la Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bin_path }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
